<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Training Quick Links - Polaroid Style</title>
  
  <!-- Fonts matching the onboarding scroller theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Shared System Colors & Theme Palette */
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --polaroid-bg: #ffffff;
      
      /* Accent Colors */
      --c-coral: #FF4E51;
      --c-indigo: #6780FF;
      --c-terracotta: #D97706;

      /* Glassmorphism Accents */
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 10px 25px -5px rgba(31, 41, 55, 0.1), 0 4px 10px -2px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: auto !important;
      background: transparent !important;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* MAIN CONTAINER: Horizontal row layout */
    .polaroid-links-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 12px 16px 12px;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 24px;
    }

    /* LINK CARD WRAPPER */
    .polaroid-link-card {
      flex: 1 1 220px;
      max-width: 260px;
      min-width: 200px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Alternating Natural Tilts */
    .card-gemini { --card-tilt: -2.5deg; }
    .card-cursor { --card-tilt: 1.8deg; }
    .card-slack  { --card-tilt: -2deg; }

    .polaroid-link-card {
      transform: rotate(var(--card-tilt));
    }

    /* HOVER ANIMATION: Straighten & Lift */
    .polaroid-link-card:hover {
      transform: rotate(0deg) translateY(-8px) scale(1.02);
      z-index: 10;
    }

    .polaroid-frame {
      width: 100%;
      background: var(--polaroid-bg);
      padding: 12px 12px 16px 12px;
      border-radius: 4px;
      box-shadow: 0 12px 28px -5px rgba(0, 0, 0, 0.14), 0 4px 10px -2px rgba(0, 0, 0, 0.05);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: box-shadow 0.3s ease;
    }

    .polaroid-link-card:hover .polaroid-frame {
      box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.2), 0 8px 15px -3px rgba(0, 0, 0, 0.08);
    }

    /* TAPE STRIP AT TOP */
    .tape-strip {
      position: absolute;
      top: -12px;
      left: 50%;
      width: 78px;
      height: 24px;
      background-color: rgba(255, 238, 180, 0.88);
      border: 1px solid rgba(220, 200, 140, 0.4);
      transform: translateX(-50%) rotate(-1deg);
      backdrop-filter: blur(2px);
      z-index: 6;
      pointer-events: none;
    }

    /* SQUARE PHOTO FRAME */
    .photo-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #e2e8f0;
      overflow: hidden;
      border-radius: 2px;
    }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .polaroid-link-card:hover .photo-img {
      transform: scale(1.06);
    }

    /* CAPTION & TAGS */
    .polaroid-caption {
      margin-top: 10px;
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* BELOW-CARD FROSTED INFO BOX */
    .card-info-box {
      width: 100%;
      margin-top: 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .category-tag {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .tag-coral { color: var(--c-coral); }
    .tag-indigo { color: var(--c-indigo); }
    .tag-terracotta { color: var(--c-terracotta); }

    .subtitle-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-bottom: 2px;
    }

    /* MINI ACTION BUTTON */
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 6px;
      transition: all 0.25s ease;
      width: 100%;
    }

    .btn-coral { background-color: var(--c-coral); box-shadow: 0 3px 10px rgba(255, 78, 81, 0.25); }
    .btn-indigo { background-color: var(--c-indigo); box-shadow: 0 3px 10px rgba(103, 128, 255, 0.25); }
    .btn-terracotta { background-color: var(--c-terracotta); box-shadow: 0 3px 10px rgba(217, 119, 6, 0.25); }

    .polaroid-link-card:hover .action-btn {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
    }

    .polaroid-link-card:hover .action-btn svg {
      transform: translateX(3px);
    }

    /* RESPONSIVE BREAKPOINT: Wrap vertically on mobile/narrow viewports */
    @media (max-width: 720px) {
      .polaroid-links-container {
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }
      .polaroid-link-card {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>
<body>

  <div class="polaroid-links-container">
    
    <!-- CARD 1: GEMINI HUB -->
    <a href="https://tripadvisor.docebosaas.com/pages/323/gemini-learning-resource-hub" target="_blank" class="polaroid-link-card card-gemini">
      <div class="polaroid-frame">
        <div class="tape-strip"></div>
        <div class="photo-wrapper">
          <img class="photo-img" src="https://gwlasiuk.github.io/airoadtripper/geminihub.png" alt="Gemini Training" onerror="this.src='https://placehold.co/300x300/e2e8f0/1f2937?text=Gemini+Hub';" />
        </div>
        <div class="polaroid-caption">Gemini Training</div>
      </div>
      <div class="card-info-box">
        <span class="category-tag tag-coral">GEMINI HUB</span>
        <span class="subtitle-text">Courses, demos & guides</span>
        <div class="action-btn btn-coral">
          <span>Explore Hub</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </div>
    </a>

    <!-- CARD 2: CURSOR LIBRARY -->
    <a href="https://tripadvisor.docebosaas.com/pages/342/ai-learning-cursor" target="_blank" class="polaroid-link-card card-cursor">
      <div class="polaroid-frame">
        <div class="tape-strip"></div>
        <div class="photo-wrapper">
          <img class="photo-img" src="https://gwlasiuk.github.io/airoadtripper_horiz/cursorhub.jpg" alt="Cursor Workflows" onerror="this.src='https://placehold.co/300x300/e2e8f0/1f2937?text=Cursor+Library';" />
        </div>
        <div class="polaroid-caption">Cursor Workflows</div>
      </div>
      <div class="card-info-box">
        <span class="category-tag tag-indigo">CURSOR LIBRARY</span>
        <span class="subtitle-text">Developer tools & guides</span>
        <div class="action-btn btn-indigo">
          <span>View Library</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </div>
    </a>

    <!-- CARD 3: SLACK COMMUNITY -->
    <a href="https://tripadvisor.enterprise.slack.com/archives/C0985DR1TV2" target="_blank" class="polaroid-link-card card-slack">
      <div class="polaroid-frame">
        <div class="tape-strip"></div>
        <div class="photo-wrapper">
          <img class="photo-img" src="https://gwlasiuk.github.io/airoadtripper_horiz/slackconnect.jpg" alt="AI Community" onerror="this.src='https://placehold.co/300x300/e2e8f0/1f2937?text=Slack+Channel';" />
        </div>
        <div class="polaroid-caption">AI Community</div>
      </div>
      <div class="card-info-box">
        <span class="category-tag tag-terracotta">SLACK COMMUNITY</span>
        <span class="subtitle-text">Join the discussion</span>
        <div class="action-btn btn-terracotta">
          <span>Open Slack</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </div>
    </a>

  </div>

</body>
</html>
